# ===================================================================
# 8G Firewall — detection maps
# Adapted from jazir555/NGINX-8G-Firewall v10 (based on Perishable
# Press's 7G/8G rules). Includes only the `map` directives — these
# evaluate every incoming request and set $block_all to 1 if any
# rule fires. Each per-site vhost decides what to do with that flag
# (typically `if ($block_all) { return 403; }`).
#
# Adjusted vs upstream:
# - Dropped curl/wget/python-requests/go-http-client from the bad-bot
#   list. They're useful dev/test tools that we run ourselves and
#   blocking them at the edge breaks our own smoke tests. The actual
#   abusive automation (acunetix, nikto, sqlmap, wpscan, masscan,
#   etc.) is still blocked.
# - Added Censys / ZGrab / Semrushbot / linkscan to the bad-bot list.
# - Dropped the upstream `geo $blocked_ip` block (we'd manage that
#   from fail2ban/iptables instead of static lists).
# - Dropped upstream `add_header` directives — nginx.conf already
#   sets the security headers we care about.
#
# The file name starts with `_` so nginx loads it before any per-site
# `*.conf` (alphabetical include order in conf.d/). The map blocks
# MUST exist before they're referenced.
# ===================================================================

# Bad user agents / scanners / headless browsers.
map $http_user_agent $bad_bot {
    default 0;
    "~*(?i)(acunetix|nikto|sqlmap|netsparker|dirbuster|masscan|burpsuite|wpscan|fimap|havij|libwww-perl|phantomjs|headlesschrome|puppeteer|selenium|censys|zgrab|semrushbot/7|linkscan)" 1;
    ""   1;   # missing/empty User-Agent header — suspicious
}

# Suspicious referers (link-spam farms, common throwaway TLDs).
map $http_referer $block_referer {
    default 0;
    "~*(?:poker|viagra|cialis|dating|porn|pharma|casino|adult|semalt|buttons-for-website)" 1;
    "~*\.(?:ru|cn|xyz|top|buzz|icu)$" 1;
}

# Suspicious query strings — XSS / SQLi / RCE / file-read patterns.
# NOTE: nginx's $query_string is the *raw* (URL-encoded) form, so each pattern
# needs to cover both the literal and the percent-encoded variants. e.g. a
# space is either ' ' or '%20', a semicolon ';' or '%3B'.
map $query_string $block_query {
    default 0;
    # XSS
    "~*(?i)(?:<script|%3Cscript|javascript:|data:text/html|onerror=|onload=|alert\(|alert%28|eval\(|eval%28|document\.cookie|window\.location)" 1;
    # SQLi keywords. The query string is URL-encoded, so we match both
    # plain and percent-encoded variants without relying on \b (which
    # interacts badly with digit-prefixed tokens like `1union`).
    "~*(?i)union[+\s]+select" 1;
    "~*(?i)union%20select" 1;
    "~*(?i)information_schema" 1;
    "~*(?i)(?:sleep\(|sleep%28|benchmark\(|benchmark%28|load_file\(|load_file%28|into(?:\s|%20|\+)+outfile|concat\(|concat%28|base64_decode\(|base64_decode%28)" 1;
    # Extremely long query — DoS / scan
    "~*[A-Za-z0-9]{1000,}" 1;
    # File-read probes
    "~*(?i)(?:etc/passwd|etc/shadow|proc/self/environ|/etc/hosts|\.ssh|\.bash_history)" 1;
    # Command injection (shell metacharacters before a known binary).
    # Match either literal `;` or `%3b` (any case) directly followed by a
    # known binary name; word boundary on the trailing side is replaced with
    # a non-letter lookahead-style group for compatibility.
    "~*(?i)(?:;|%3b)(?:wget|curl)(?:[^a-z]|$)" 1;
    "~*(?i)(?:;|%3b)(?:nc|rm|bash|sh)(?:[^a-z]|$)" 1;
}

# Suspicious URIs and file-extension scans.
map $request_uri $block_uri {
    default 0;
    "~*(?:phpinfo|shell\.php|c99\.php|r57\.php|wso\.php|sqlmap|adminer|log4shell|/\.env|/\.htaccess|/wp-config\.php|/xmlrpc\.php)" 1;
    "~*\.(?:cgi|asp|aspx|dll|exe|jsp|mdb|sh|bat|pl|ps1|vbs|pfx|pem|crt|key)$" 1;
    "~*(?:/\.git|/\.svn|\.sql$|\.bak$|backup/)" 1;
}

# Suspicious / dangerous HTTP methods.
map $request_method $block_method {
    default 0;
    "~*(?:TRACE|TRACK|CONNECT|MOVE|PROPFIND|PROPPATCH|COPY|LOCK|UNLOCK|MKCOL)" 1;
}

# Combined flag: 1 if any detector fired.
map "$bad_bot$block_referer$block_query$block_uri$block_method" $block_all {
    default 0;
    "~*1" 1;
}
