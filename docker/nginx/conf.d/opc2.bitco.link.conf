server {
    listen 80;
    server_name opc2.bitco.link;

    root /var/www/sites/opc2.bitco.link/public;
    index index.php index.html;

    access_log /var/log/nginx/opc2.bitco.link.access.log main;
    error_log /var/log/nginx/opc2.bitco.link.error.log warn;

    limit_req zone=general burst=20 nodelay;

    # 8G firewall — see _8g.conf for the detection maps.
    if ($block_all) { return 403; }

    location ~ /\. { deny all; return 404; }
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|bak|conf|test|orig|old)$ { deny all; return 404; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/sites:/tmp:/usr/share/php:/usr/local/bin:/proc";
        fastcgi_hide_header X-Powered-By;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}