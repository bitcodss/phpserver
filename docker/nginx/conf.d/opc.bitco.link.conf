server {
    listen 80;
    server_name opc.bitco.link;

    root /var/www/sites/opc.bitco.link/public;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/opc.bitco.link.access.log main;
    error_log /var/log/nginx/opc.bitco.link.error.log warn;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Security: deny access to sensitive files
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|bak|conf)$ {
        deny all;
        return 404;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php74:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Security
        fastcgi_param PHP_VALUE "open_basedir=/var/www/sites:/tmp:/usr/share/php:/usr/local/bin:/proc";
        fastcgi_hide_header X-Powered-By;

        # Timeouts
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Default location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to PHP-FPM status
    location ~ ^/(fpm-status|fpm-ping)$ {
        deny all;
    }
}
