
services:
  php74:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: cid-php74
    restart: unless-stopped
    volumes:
      - ../sites:/var/www/sites
      - ./php/conf:/usr/local/etc/php-conf
      - ./php/conf/php-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./php/conf/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - fpm-socket:/run/php-fpm
      - broker-socket:/run/broker:ro
      # Backup download staging — broker chowns to root:www-data 0640.
      - /var/cid-restores:/var/cid-restores
    networks:
      - cid-network
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH}
      OPC2_DB_HOST: ${OPC2_DB_HOST}
      OPC2_DB_NAME: ${OPC2_DB_NAME}
      OPC2_DB_USER: ${OPC2_DB_USER}
      OPC2_DB_PASSWORD: ${OPC2_DB_PASSWORD}
      OPC2_STATUS_TOKEN: ${OPC2_STATUS_TOKEN}
      OPC2_RAWDATA_TOKEN: ${OPC2_RAWDATA_TOKEN}
      SITE_PUBLIC_IP: ${SITE_PUBLIC_IP:-}
      PMA_PUBLIC_URL: ${PMA_PUBLIC_URL:-}
    depends_on:
      - mariadb
      - redis
      - broker

  nginx:
    image: nginx:1.24-alpine
    container_name: cid-nginx
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../sites:/var/www/sites
      - ./logs/nginx:/var/log/nginx
      - fpm-socket:/run/php-fpm:ro
    networks:
      - cid-network
    depends_on:
      - php74

  mariadb:
    image: mariadb:10.11
    container_name: cid-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      TZ: Asia/Bangkok
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./logs/mariadb:/var/log/mysql
    networks:
      - cid-network
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: cid-phpmyadmin
    restart: unless-stopped
    ports:
      - "9081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      TZ: Asia/Bangkok
    networks:
      - cid-network
    depends_on:
      - mariadb

  redis:
    image: redis:7-alpine
    container_name: cid-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - cid-network

  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    container_name: cid-broker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - broker-socket:/run/broker
      # Backup engine: state JSON written by broker, read by admin UI.
      - ../sites/opc.bitco.link/public/admin/data:/admin-data
      # Site backups read this read-only.
      - ../sites:/var/www/sites:ro
      # Restore + download staging (shared rw with cid-php74).
      - /var/cid-restores:/var/cid-restores
      # ---- Config-backup sources (read-only) ----
      # The __system_config_backup__ job tars these together so a fresh-host
      # rebuild can put everything back. Restic encrypts the stream client-side.
      # See sites/.../admin/data/.tar embedded RESTORE-NOTES.txt for the
      # ownership / restorability annotation of each path.
      - /etc/cid-backup.env:/host-config/cid-backup.env:ro
      - ./.env:/host-config/docker.env:ro
      - ./docker-compose.yml:/host-config/docker-compose.yml:ro
      - /etc/cron.d:/host-config/cron.d:ro
      - /etc/ssh/sshd_config.d:/host-config/sshd_config.d:ro
      - /etc/fail2ban:/host-config/fail2ban:ro
      - /home/bitcodata/.ssh/authorized_keys:/host-config/authorized_keys:ro
      - /var/spool/cron/crontabs:/host-config/user-crontabs:ro
      - /etc/docker/daemon.json:/host-config/docker-daemon.json:ro
      - /var/lib/dpkg:/host-config/dpkg:ro
      # NOTE: /var/lib/caddy/ intentionally removed in Phase 0.2.1 — Caddy
      # runs in the openclaw-caddy-1 container, owned by the separate
      # `openclaw` project. The host /var/lib/caddy/ is empty on this box
      # and including it was misleading. Caddy DR belongs to openclaw.
    networks:
      - cid-network
    extra_hosts:
      # Lets the broker reach the host's Caddy admin without --network=host.
      - "host.docker.internal:host-gateway"
    # Restic + B2 credentials + optional BACKUP_NOTIFY_URL + optional PHP_GID
    # all live in /etc/cid-backup.env (0600 root). Single source of truth.
    env_file:
      - /etc/cid-backup.env
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:-http://host.docker.internal:2019}

  sftp:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: cid-sftp
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - ../sites:/config/sites
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - USER_NAME=${SFTP_USER}
      - USER_PASSWORD=${SFTP_PASSWORD}
      - PASSWORD_ACCESS=true
      - LOG_STDOUT=true
    networks:
      - cid-network

volumes:
  mariadb-data:
  redis-data:
  fpm-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
  broker-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  cid-network:
    name: cid-network
    driver: bridge
