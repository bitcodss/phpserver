; ===================================
; PHP 7.4 Custom Configuration
; Managed by ศ.Cid
; ===================================

[PHP]
; General
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; Error handling — errors go to the FPM stderr (docker logs), not the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Security hardening
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
disable_functions = passthru,parse_ini_file,show_source,dl
open_basedir = /var/www/sites:/tmp:/usr/share/php:/usr/local/bin:/proc

; Session security
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.save_handler = redis
session.save_path = "tcp://redis:6379"

; Timezone
date.timezone = Asia/Bangkok

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.interned_strings_buffer = 16

; Realpath cache
realpath_cache_size = 4096k
realpath_cache_ttl = 600
